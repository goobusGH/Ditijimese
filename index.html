
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ditijimese Translator</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f0ff;
      color: #29213b;
    }
    textarea, .output {
      box-sizing: border-box;
      width: 100%;
      min-height: 120px;
      padding: 16px;
      border: 2px solid #c7b5ed;
      border-radius: 12px;
      background: white;
      font-size: 24px;
    }
    .output { white-space: pre-wrap; overflow-wrap: anywhere; }
    label { display: block; margin: 20px 0 8px; }
  </style>
</head>
<body>
  <h1>Ditijimese</h1>
  <p>Type your language and watch it transform!</p>

  <label for="source">Romanized Ditijimese</label>
  <textarea id="source" placeholder="Type heya ku..."></textarea>

  <label>Ditijimese characters</label>
  <div class="output" id="output"></div>

  <script>
    const syllables = {
      he: "\uE000",
      ya: "\uE001",
      ku: "\uE002"
    };

    const source = document.querySelector("#source");
    const output = document.querySelector("#output");

    function translate(text) {
      // Match known syllables, longest first.
      const keys = Object.keys(syllables)
        .sort((a, b) => b.length - a.length);

      const pattern = new RegExp(keys.join("|"), "g");
      return text.replace(pattern, match => syllables[match]);
    }

    source.addEventListener("input", () => {
      output.textContent = translate(source.value);
    });
  </script>
</body>
</html>
